services:
  - type: web
    name: local-faces
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn localfaces.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: local-faces-db
          property: connectionString

databases:
  - name: local-faces-db
    plan: free
    databaseName: localfaces
    user: localfaces
