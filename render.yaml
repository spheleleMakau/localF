services:
  - type: web
    name: local-faces
    runtime: python
    plan: starter
    disk:
      name: private-applicant-uploads
      mountPath: /var/data
      sizeGB: 1
    buildCommand: ./build.sh
    startCommand: gunicorn localfaces.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/private_uploads
      - key: LOCAL_FACES_WHATSAPP_NUMBER
        value: "27681946795"
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: info@localfaces.co.za
      - key: DATABASE_URL
        fromDatabase:
          name: local-faces-db
          property: connectionString

databases:
  - name: local-faces-db
    plan: basic-256mb
    databaseName: localfaces
    user: localfaces
